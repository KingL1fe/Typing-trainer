<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="script.js" defer></script>
    <link rel="shortcut icon" href="./img/keyboard_key_w.png" type="image/x-icon">
    <title>WType</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
        <img src="./img/keyboard_key_w.png" alt="">
        WType
      </div>
        <button title="settings" class="settings">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="30px"
            viewBox="0 -960 960 960"
            width="30px"
            fill="#e3e3e3"
          >
            <path
              d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"
            />
          </svg>
        </button>
      </nav>
    </header>
    <div class="container">
      <main>
        <div class="description">
          <h1 id="desc-h">Words Per Minute Test</h1>
          <p id="desc-p">
            Measure your WPM typing speed with a simple WPM typing test
          </p>
        </div>
        <section class="stats">
          <div class="WPM">
            <span id="stat">WPM:</span>
            <span id="WPM"></span>
          </div>
          <div class="Accuracy">
            <span id="accuracy">0</span><span>%</span>
          </div>
          <div class="Errors">
            <span id="stat">Errors:</span>
            <span id="error-count">0</span>
          </div>
        </section>
        <div class="container-fluid">
          <section class="typing-area">
            <div class="text"></div>
          </section>
        </div>

        <section class="keyboard">
          <div class="keyboard-container">
            <div class="keyboard-row">
              <button class="key key-small" data-key="`">`</button>
              <button class="key" data-key="1">1</button>
              <button class="key" data-key="2">2</button>
              <button class="key" data-key="3">3</button>
              <button class="key" data-key="4">4</button>
              <button class="key" data-key="5">5</button>
              <button class="key" data-key="6">6</button>
              <button class="key" data-key="7">7</button>
              <button class="key" data-key="8">8</button>
              <button class="key" data-key="9">9</button>
              <button class="key" data-key="0">0</button>
              <button class="key" data-key="-">-</button>
              <button class="key" data-key="=">=</button>
              <button class="key key-backspace" data-key="Backspace">
                Backspace
              </button>
            </div>

            <div class="keyboard-row">
              <button class="key key-tab" data-key="Tab">Tab</button>
              <button class="key" data-key="q">Q</button>
              <button class="key" data-key="w">W</button>
              <button class="key" data-key="e">E</button>
              <button class="key" data-key="r">R</button>
              <button class="key" data-key="t">T</button>
              <button class="key" data-key="y">Y</button>
              <button class="key" data-key="u">U</button>
              <button class="key" data-key="i">I</button>
              <button class="key" data-key="o">O</button>
              <button class="key" data-key="p">P</button>
              <button class="key" data-key="[">[</button>
              <button class="key" data-key="]">]</button>
              <button class="key" data-key="\">\</button>
            </div>

            <div class="keyboard-row">
              <button class="key key-caps" data-key="CapsLock">
                Caps Lock
              </button>
              <button class="key" data-key="a">A</button>
              <button class="key" data-key="s">S</button>
              <button class="key" data-key="d">D</button>
              <button class="key" data-key="f">F</button>
              <button class="key" data-key="g">G</button>
              <button class="key" data-key="h">H</button>
              <button class="key" data-key="j">J</button>
              <button class="key" data-key="k">K</button>
              <button class="key" data-key="l">L</button>
              <button class="key" data-key=";">;</button>
              <button class="key" data-key="'">'</button>
              <button class="key key-enter" data-key="Enter">Enter</button>
            </div>

            <div class="keyboard-row">
              <button class="key key-shift" data-key="Shift">Shift</button>
              <button class="key" data-key="z">Z</button>
              <button class="key" data-key="x">X</button>
              <button class="key" data-key="c">C</button>
              <button class="key" data-key="v">V</button>
              <button class="key" data-key="b">B</button>
              <button class="key" data-key="n">N</button>
              <button class="key" data-key="m">M</button>
              <button class="key" data-key=",">,</button>
              <button class="key" data-key=".">.</button>
              <button class="key" data-key="/">/</button>
              <button class="key key-shift" data-key="Shift">Shift</button>
            </div>

            <div class="keyboard-row">
              <button class="key key-control" data-key="Control">Ctrl</button>
              <button class="key key-alt" data-key="Alt">Alt</button>
              <button class="key key-space" data-key=" ">Space</button>
              <button class="key key-alt" data-key="Alt">Alt</button>
              <button class="key key-control" data-key="Control">Ctrl</button>
            </div>
          </div>
        </section>
        <div class="result-window">
          <div class="close-btn">
            <button class="close">X</button>
          </div>
          <div class="res-container">
            <h1>Results</h1>
            <div><span>WPM: </span><span class="res-WPM"></span></div>
            <div><span>Acc: </span><span class="res-acc"></span></div>
            <div><span>Errors: </span><span class="res-errors">0</span></div>
            <div><span>Rank: </span><span class="rank"></span></div>
            <div class="restart"><button class="retry-btn">RETRY<div class="retry-icon">
              <svg  xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000"><path d="M314-115q-104-48-169-145T80-479q0-26 2.5-51t8.5-49l-46 27-40-69 191-110 110 190-70 40-54-94q-11 27-16.5 56t-5.5 60q0 97 53 176.5T354-185l-40 70Zm306-485v-80h109q-46-57-111-88.5T480-800q-55 0-104 17t-90 48l-40-70q50-35 109-55t125-20q79 0 151 29.5T760-765v-55h80v220H620ZM594 0 403-110l110-190 69 40-57 98q118-17 196.5-107T800-480q0-11-.5-20.5T797-520h81q1 10 1.5 19.5t.5 20.5q0 135-80.5 241.5T590-95l44 26-40 69Z"/></svg>
            </div></button></div>
          </div>
        </div>
        <div class="retryAgain"><button class="retry">RETRY<div class="retry-icon-2"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000"><path d="M314-115q-104-48-169-145T80-479q0-26 2.5-51t8.5-49l-46 27-40-69 191-110 110 190-70 40-54-94q-11 27-16.5 56t-5.5 60q0 97 53 176.5T354-185l-40 70Zm306-485v-80h109q-46-57-111-88.5T480-800q-55 0-104 17t-90 48l-40-70q50-35 109-55t125-20q79 0 151 29.5T760-765v-55h80v220H620ZM594 0 403-110l110-190 69 40-57 98q118-17 196.5-107T800-480q0-11-.5-20.5T797-520h81q1 10 1.5 19.5t.5 20.5q0 135-80.5 241.5T590-95l44 26-40 69Z"/></svg></button></div></div>
      </main>
    </div>
  </body>
</html>
